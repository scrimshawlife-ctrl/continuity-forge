name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Environment receipt
        run: |
          python --version
          python -m pip --version
          uname -a

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy packages apps

      - name: Tests and coverage
        run: |
          python -m pytest \
            --cov=continuity_forge_ir \
            --cov=continuity_forge_compiler \
            --cov=continuity_forge_providers \
            --cov=continuity_forge_api \
            --cov=continuity_forge_mcp \
            --cov-report=term-missing
