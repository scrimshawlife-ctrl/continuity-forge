# Phase 2 integration skeleton — Postgres 16 + MinIO smoke.
# Separate from the default fast PR merge gate (ci.yml → validate_m0).
# Tests skip when services are missing (local-friendly); this job provides them.
name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-minio:
    name: postgres-minio-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: continuity
          POSTGRES_PASSWORD: continuity
          POSTGRES_DB: continuity_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U continuity -d continuity_forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # bitnami starts the server from env (minio/minio needs an explicit server cmd,
      # which GHA service containers do not support cleanly).
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CF_DATABASE_URL: postgresql://continuity:continuity@localhost:5432/continuity_forge
      CF_S3_ENDPOINT: http://127.0.0.1:9000
      CF_S3_BUCKET: continuity-forge
      CF_S3_ACCESS_KEY: minioadmin
      CF_S3_SECRET_KEY: minioadmin
      CF_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Environment receipt
        run: |
          python --version
          python -m pip --version
          uname -a
          echo "CF_DATABASE_URL=${CF_DATABASE_URL}"
          echo "CF_S3_ENDPOINT=${CF_S3_ENDPOINT}"
          echo "CF_S3_BUCKET=${CF_S3_BUCKET}"

      - name: Install production + dev extras
        run: |
          python -m pip install --upgrade pip
          # production: psycopg + boto3 (+ temporal/openai/httpx); dev: pytest
          python -m pip install -e '.[dev,production]'
          python -m pip check

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import os, sys, time
          import psycopg
          url = os.environ["CF_DATABASE_URL"]
          last = None
          for i in range(30):
              try:
                  with psycopg.connect(url, connect_timeout=2) as conn:
                      conn.execute("SELECT 1")
                  print(f"postgres ready after {i + 1} attempt(s)")
                  sys.exit(0)
              except Exception as exc:  # noqa: BLE001
                  last = exc
                  time.sleep(1)
          print(f"postgres not ready: {last}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Wait for MinIO + ensure bucket
        run: |
          python - <<'PY'
          import os, sys, time
          import boto3
          from botocore.client import Config
          from botocore.exceptions import BotoCoreError, ClientError

          endpoint = os.environ["CF_S3_ENDPOINT"]
          bucket = os.environ["CF_S3_BUCKET"]
          client = boto3.client(
              "s3",
              endpoint_url=endpoint,
              aws_access_key_id=os.environ["CF_S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["CF_S3_SECRET_KEY"],
              region_name=os.environ.get("CF_S3_REGION", "us-east-1"),
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          last = None
          for i in range(40):
              try:
                  client.list_buckets()
                  print(f"minio ready after {i + 1} attempt(s)")
                  break
              except (BotoCoreError, ClientError, OSError) as exc:
                  last = exc
                  time.sleep(1)
          else:
              print(f"minio not ready: {last}", file=sys.stderr)
              sys.exit(1)

          try:
              client.head_bucket(Bucket=bucket)
              print(f"bucket exists: {bucket}")
          except ClientError:
              client.create_bucket(Bucket=bucket)
              print(f"bucket created: {bucket}")
          PY

      - name: Integration smoke (Postgres + MinIO)
        run: |
          python -m pytest tests/integration/test_postgres_minio_smoke.py -v --tb=short
          echo "Integration gate: PASS"
