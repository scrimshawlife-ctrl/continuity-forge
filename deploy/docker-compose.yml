# Local production stack: Postgres, MinIO, Temporal, API, worker
# Usage:
#   docker compose -f deploy/docker-compose.yml up --build
#   curl -H "Authorization: Bearer dev-local-key" http://localhost:8080/health

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: continuity
      POSTGRES_PASSWORD: continuity
      POSTGRES_DB: continuity_forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuity -d continuity_forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/continuity-forge || true;
      exit 0;
      "

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: continuity
      POSTGRES_PWD: continuity
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: >
      uvicorn continuity_forge_api.main:app --host 0.0.0.0 --port 8080
    environment:
      CF_AUTH_REQUIRED: "1"
      CF_DATABASE_URL: postgresql://continuity:continuity@postgres:5432/continuity_forge
      CF_S3_ENDPOINT: http://minio:9000
      CF_S3_BUCKET: continuity-forge
      CF_S3_ACCESS_KEY: minioadmin
      CF_S3_SECRET_KEY: minioadmin
      CF_PROVIDER: mock
      CF_BOOTSTRAP_DEV_TENANT: "1"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: continuity-forge-worker --host temporal:7233 --namespace default
    environment:
      CF_TEMPORAL_HOST: temporal:7233
      CF_TEMPORAL_NAMESPACE: default
      CF_TEMPORAL_TASK_QUEUE: continuity-forge-kernel
      CF_DATABASE_URL: postgresql://continuity:continuity@postgres:5432/continuity_forge
      CF_PROVIDER: mock
    depends_on:
      - temporal
      - postgres

volumes:
  pgdata:
  miniodata:
