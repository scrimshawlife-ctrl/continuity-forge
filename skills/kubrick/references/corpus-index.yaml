index_version: 0.5.0
retrieval_rules: 'See corpus-usage.md: identify dramatic problem first, one primary
  grammar, at most two secondary, prefer process over icon, always retrieve provenance.'
by_dramatic_problem:
  identity_dissolution_breakdown:
    primary_grammar: putrefaction / nigredo (alchemical)
    affordances:
    - CONTAMINATE
    - INVERT
    - DESCEND
    patterns:
    - alchemical_nigredo_putrefaction
    cinematic:
    - reduced palette
    - negative space dominance
    - slow camera into void
    provenance_note: PRIMARY alchemy + Freud
  threshold_crossing_status_change:
    primary_grammar: liminal passage / initiation
    affordances:
    - CROSS
    - INITIATE
    - ENCLOSE
    patterns:
    - liminal_threshold_crossing
    - propp_villainy_lack_mediation
    cinematic:
    - frame edge crossing
    - sound change at boundary
    - new composition post-crossing
    provenance_note: SCHOLARLY (Turner/van Gennep) + Propp
  hidden_connection_revelation:
    primary_grammar: correspondence / as above so below
    affordances:
    - MIRROR
    - REVEAL
    - BIND
    patterns:
    - hermetic_as_above_so_below
    - peircean_icon_index_symbol
    cinematic:
    - parallel framing micro/macro
    - graphic match across scales
    provenance_note: PRIMARY Hermeticum + Peirce
  compulsion_repetition_pressure:
    primary_grammar: rhythmic repetition / recurrence with mutation
    affordances:
    - REPEAT
    - CONTAMINATE
    patterns:
    - rhythmic_repetition_cadence
    - geometric_enclosure_breaking
    cinematic:
    - pulse in camera/editing/sound
    - geometry that tightens or breaks
    provenance_note: PRIMARY rhythmic traditions + film analysis
  unseen_power_threat:
    primary_grammar: acousmatic / offscreen
    affordances:
    - CONCEAL
    - HAUNT
    - REVEAL
    patterns:
    - acousmatic_sound_offscreen_power
    - trickster_boundary_violation
    cinematic:
    - reaction to unseen source
    - sound bridge
    - empty frame with dominant sound
    provenance_note: SCHOLARLY Chion + folklore trickster cycles
  memory_personal_residue:
    primary_grammar: condensation / personal association
    affordances:
    - TRANSFER
    - MIRROR
    - HAUNT
    patterns:
    - personal_association_residue
    - cinematic_graphic_match_substitution
    cinematic:
    - lingering on private detail
    - match cut carrying private charge
    provenance_note: PRIMARY Freud method
  group_discipline_vs_desire:
    primary_grammar: geometric binding / fragmentation
    affordances:
    - BIND
    - INVERT
    - FRAGMENT
    patterns:
    - geometric_enclosure_breaking (Denis marching example)
    - contemporary_corporate_iconography
    cinematic:
    - repetitive formation
    - body as geometry
    - rhythm mutating to collapse
    provenance_note: film-derived (Denis Beau Travail)
  brand_or_meme_identity:
    primary_grammar: modern myth / viral symbol
    affordances:
    - BIND
    - CONTAMINATE
    - INVERT
    patterns:
    - contemporary_corporate_iconography
    - internet_meme_viral_symbol
    cinematic:
    - logo as center
    - meme pose or image inserted
    - brand space contamination
    provenance_note: PRIMARY advertising artifacts + digital folklore
by_affordance:
  BIND:
  - hermetic_as_above_so_below
  - rhythmic_repetition_cadence
  - geometric_enclosure_breaking
  CONTAMINATE:
  - alchemical_nigredo_putrefaction
  - red_carpet (Kubrick)
  - contemporary_corporate_iconography
  INVERT:
  - propp_villainy_lack_mediation
  - trickster_boundary_violation
  - acousmatic_sound_offscreen_power
  REPEAT:
  - rhythmic_repetition_cadence
  - motif_lifecycle (core)
  - Resnais repetition patterns
  MIRROR:
  - peircean_icon_index_symbol
  - Tarkovsky water/reflection
  - Lynch red room
  CROSS / INITIATE:
  - liminal_threshold_crossing
  - monolith (Kubrick)
  - Bresson hands (transfer as crossing)
by_cinematic_technique:
  graphic_match:
  - cinematic_graphic_match_substitution
  - Kubrick bone-to-station
  - Resnais memory matches
  acousmatic_sound:
  - acousmatic_sound_offscreen_power
  - Tarkovsky water sounds
  negative_space / broken symmetry:
  - geometric_enclosure_breaking
  - Kubrick Shining carpet and twins
  repetitive_pulse:
  - rhythmic_repetition_cadence
  - Denis marching
  - Bresson hands rhythm
by_source_tier_example:
  PRIMARY:
  - Corpus Hermeticum
  - Freud Interpretation of Dreams
  - Propp Morphology
  - Saussure Course
  - Peirce papers
  - Primary alchemical texts (Rosarium, Zosimos)
  - Vitruvius
  - Traditional rhythmic systems
  - Original film artifacts (Kubrick, Tarkovsky, Bresson, Denis, etc.)
  - Advertising primaries (Apple 1984, etc.)
  SCHOLARLY:
  - Eliade Sacred and the Profane
  - Turner Ritual Process
  - Chion Audio-Vision
  - Shifman Memes in Digital Culture
notes:
- Always return provenance with any retrieved pattern.
- For film-derived patterns, cite the specific film + director.
- This index is for fast routing only; full details live in the pattern files and
  registries.
retrieval_scoring:
  weights:
    dramatic_fit: 0.25
    character_fit: 0.15
    cultural_fit: 0.15
    cinematic_fit: 0.15
    source_quality: 0.1
    mutation_potential: 0.1
    continuity_compatibility: 0.1
    "clich\xE9_risk": -0.2
  minimum_threshold: 0.55
  return_if_below: NOT_COMPUTABLE
exclusion_profiles:
  identity_fragmentation:
    dramatic_problem: identity fragmentation
    overused_patterns:
    - broken mirror
    - doubled face reflection
    - black-and-white split
    - unexplained twins
    cultural_conflicts: []
    genre_mismatches:
    - pure comedy
    "visual_clich\xE9s":
    - literal shattered glass
    - two-sided lighting on face
    prohibited_source_families:
    - modern pop psychology without grounding
project_symbolic_ledger_template:
  governing_grammar: null
  supporting_grammars: []
  active_motifs: []
  retired_motifs: []
  prohibited_motifs: []
  scene_usage: {}
  shot_usage: {}
  unresolved_payoffs: []
  completed_payoffs: []
  symbolic_debt: []
  saturation_score: 0.0
symbolic_budget_defaults:
  project_density_target: 1
  sequence_density_target: 2
  maximum_active_motifs_per_scene: 3
  maximum_symbolic_channels_per_beat: 2
  explicitness_ceiling: peripheral
  recurrence_spacing: at least one scene or significant mutation between recurrences
  overload_failure: SYMBOLIC_OVERLOAD
motif_collision_types:
- REDUNDANT
- CONTRADICTORY
- CULTURALLY_INCOMPATIBLE
- VISUALLY_CONFUSING
- RHYTHMICALLY_OVERLAPPING
- PAYOFF_COMPETITION
