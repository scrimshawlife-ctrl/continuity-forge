[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "continuity-forge"
version = "1.5.2"
description = "Deterministic cinematic-production kernel and durable harness for drift-resistant AI film generation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
  "build>=1.2,<2",
]
temporal = [
  "temporalio>=1.7,<2",
]
postgres = [
  "psycopg[binary]>=3.1,<4",
]
s3 = [
  "boto3>=1.34,<2",
]
openai = [
  "openai>=1.40,<2",
]
http = [
  "httpx>=0.27,<1",
]
kubrick-helpers = ["pyyaml>=6.0"]
production = [
  "temporalio>=1.7,<2",
  "psycopg[binary]>=3.1,<4",
  "boto3>=1.34,<2",
  "openai>=1.40,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
continuity-forge = "continuity_forge_compiler.cli:app"
continuity-forge-mcp = "continuity_forge_mcp.server:main"
continuity-forge-worker = "continuity_forge_harness.temporal_runtime:worker_main"
kubrick-retrieve = "kubrick_helpers.retrieval:main"
kubrick-evolve = "kubrick_helpers.evolution:main"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/production_ir/src/continuity_forge_ir",
  "packages/compiler/src/continuity_forge_compiler",
  "packages/continuity_ledger/src/continuity_forge_ledger",
  "packages/shot_contracts/src/continuity_forge_shots",
  "packages/harness/src/continuity_forge_harness",
  "packages/operator/src/continuity_forge_operator",
  "packages/repair/src/continuity_forge_repair",
  "packages/providers/src/continuity_forge_providers",
  "packages/auth/src/continuity_forge_auth",
  "packages/persistence/src/continuity_forge_persistence",
  "packages/runtime/src/continuity_forge_runtime",
  "apps/api/src/continuity_forge_api",
  "apps/mcp/src/continuity_forge_mcp",
  "packages/kubrick_helpers/src/kubrick_helpers",
]

[tool.hatch.build.targets.sdist]
# Keep sdist installable; exclude local tooling and caches (also covered by .gitignore).
exclude = [
  "/.venv",
  "/.venv-*",
  "/venv",
  "/.git",
  "/.github",
  "/.grok",
  "/.hallmark",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/dist",
  "/build",
  "/out",
  "/htmlcov",
  "/.coverage",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/production_ir/src",
  "packages/compiler/src",
  "packages/continuity_ledger/src",
  "packages/shot_contracts/src",
  "packages/harness/src",
  "packages/operator/src",
  "packages/repair/src",
  "packages/providers/src",
  "packages/auth/src",
  "packages/persistence/src",
  "packages/runtime/src",
  "apps/api/src",
  "apps/mcp/src",
]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires live Postgres/MinIO (or CF_* env); skips when unavailable",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends() in defaults is idiomatic.
"apps/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
