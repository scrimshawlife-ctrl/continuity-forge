[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "continuity-forge"
version = "0.2.0"
description = "Deterministic script-to-production compiler for drift-resistant AI film generation"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
  "build>=1.2,<2",
]

[project.scripts]
continuity-forge = "continuity_forge_compiler.cli:app"
continuity-forge-mcp = "continuity_forge_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/production_ir/src/continuity_forge_ir",
  "packages/compiler/src/continuity_forge_compiler",
  "packages/providers/src/continuity_forge_providers",
  "apps/api/src/continuity_forge_api",
  "apps/mcp/src/continuity_forge_mcp",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/production_ir/src",
  "packages/compiler/src",
  "packages/providers/src",
  "apps/api/src",
  "apps/mcp/src",
]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
